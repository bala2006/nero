# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-nero
  name: '@nero/nero-llm-nero'
  disabled: true

- id: acp
  name: '@nero/nero-acp'
  config:
    provider: nero-official
    model: nero-v4-flash

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js process.env.NERO_SNAPSHOT_SESSIONS_ROOT ?? neroHomePath('sessions')
    compression: none

- id: sandbox
  name: '@nero/nero-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@nero/nero-llm-replay'
      config:
        providers:
          - id: nero-official
            name: Nero
            models:
              - id: nero-v4-flash
              - id: nero-v4-pro

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'

- insert:
    - id: snapshot-shell-path
      name: ../../../scripts/snapshot-shell-path.ts
      config:
        command: "printf 'escalated\\n' > /tmp/nero-escalated.txt && cat /tmp/nero-escalated.txt && rm /tmp/nero-escalated.txt"
        recordedPath: /tmp/nero-escalated.txt
        livePath: !!js process.env.NERO_SNAPSHOT_SPILL_ROOT + '/nero-escalated.txt'
