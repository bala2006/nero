# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@nero/nero-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-nero
  name: '@nero/nero-llm-nero'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js neroHomePath('sessions')
    compression: !!js "process.env.NERO_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@nero/nero-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: session-log-nero
  config:
    enabled: false
