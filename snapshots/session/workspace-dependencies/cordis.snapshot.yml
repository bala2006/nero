# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-nero
  name: '@nero/nero-llm-nero'
  disabled: true

- id: plugin-package-inventory-nero
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js neroHomePath('sessions')
    compression: none

- id: sandbox
  name: '@nero/nero-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@nero/nero-llm-replay'
      config:
        providers:
          - id: nero-official
            name: Nero
            models:
              - id: nero-v4-flash
              - id: nero-v4-pro
          - id: nero-messages
            name: Nero Messages
            models:
              - id: nero-v4-flash
              - id: nero-v4-pro

- insert:
    - id: workspace-dependencies
      name: '@nero/nero-tool-workspace-dependencies'
      config:
        source: !!js process.cwd() + "/runtime-source"
        root: !!js process.cwd() + "/runtime-installed"

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
