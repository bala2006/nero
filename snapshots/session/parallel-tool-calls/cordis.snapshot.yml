# Keyless filesystem snapshots combine spill settings with replay. The
# sandboxed filesystem stack already lives in `nero-base`; the ACP row re-pins
# `nero-v4-flash` for the recorded corpus.
- id: llm-nero
  name: '@nero/nero-llm-nero'
  disabled: true

- id: agent-default-model
  name: '@nero/nero-agent-default-model'
  config:
    provider: nero-official
    model: nero-v4-flash

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js neroHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@nero/nero-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@nero/nero-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@nero/nero-llm-replay'
      config:
        providers:
          - id: nero-official
            name: Nero
            models:
              - id: nero-v4-flash
              - id: nero-v4-pro

- id: spill-local
  name: '@nero/nero-spill-local'
  config:
    root: !!js process.env.NERO_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@nero/nero-spill-policy'
  config:
    maxInlineTokens: 200

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.NERO_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.NERO_SNAPSHOT_SPILL_LOCATOR_ROOT
