# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-nero
  name: '@nero/nero-llm-nero'
  disabled: true

- insert:
    - id: llm-replay
      name: '@nero/nero-llm-replay'
      config:
        providers:
          - id: nero-official
            name: Nero
            models:
              - id: nero-v4-pro

- insert:
    - id: terminal
      name: '@nero/nero-terminal'

- id: sandbox-policy
  name: '@nero/nero-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@nero/nero-subprocess-local'

- insert:
    - id: terminal-pwsh
      name: '@nero/nero-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@nero/nero-agent-default-model'
  config:
    provider: nero-official
    model: nero-v4-pro

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js neroHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@nero/nero-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@nero/nero-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@nero/nero-tool-jobs'
  disabled: true

- id: goal
  name: '@nero/nero-goal'
  disabled: true

- id: goal-round-driver
  name: '@nero/nero-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@nero/nero-command-goal'
  disabled: true

- id: tool-goal
  name: '@nero/nero-tool-goal'
  disabled: true

- id: skill
  name: '@nero/nero-skill'
  disabled: true

- id: skill-filesystem
  name: '@nero/nero-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@nero/nero-tool-skill'
  disabled: true

- id: tool-bash
  name: '@nero/nero-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@nero/nero-tool-pwsh-persistent'
