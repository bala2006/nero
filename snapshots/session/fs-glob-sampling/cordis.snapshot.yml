# Minimal keyless composition: real app, bash, and search tool; replayed model.
- id: llm-nero
  name: '@nero/nero-llm-nero'
  disabled: true

- insert:
    - id: llm-replay
      name: '@nero/nero-llm-replay'
      config:
        providers:
          - id: nero-official
            name: Nero
            models:
              - id: nero-v4-pro

- id: subprocess
  name: '@nero/nero-subprocess-local'

- id: agent-default-model
  name: '@nero/nero-agent-default-model'
  config:
    provider: nero-official
    model: nero-v4-pro

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js neroHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@nero/nero-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@nero/nero-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@nero/nero-tool-jobs'
  disabled: true

- id: goal
  name: '@nero/nero-goal'
  disabled: true

- id: goal-round-driver
  name: '@nero/nero-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@nero/nero-command-goal'
  disabled: true

- id: tool-goal
  name: '@nero/nero-tool-goal'
  disabled: true

- id: skill
  name: '@nero/nero-skill'
  disabled: true

- id: skill-filesystem
  name: '@nero/nero-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@nero/nero-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@nero/nero-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@nero/nero-spill-local'
  config:
    root: !!js process.env.NERO_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.NERO_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.NERO_SNAPSHOT_SPILL_LOCATOR_ROOT
