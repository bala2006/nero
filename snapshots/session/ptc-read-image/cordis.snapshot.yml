# Keyless replay combines PTC mode with the durable image store and an exact
# image-capable replay route. The scenario generates its tiny PNG inside the
# run_code program, then exercises read_image as a nested dispatch.
- id: llm-nero
  name: '@nero/nero-llm-nero'
  disabled: true

- id: plugin-package-inventory-nero
  disabled: true

- id: agent-default-model
  name: '@nero/nero-agent-default-model'
  config:
    provider: nero-official
    model: nero-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js neroHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@nero/nero-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@nero/nero-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@nero/nero-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@nero/nero-llm-replay'
      config:
        providers:
          - id: nero-official
            name: Nero
            models:
              - id: nero-v4-flash
                inputModalities: [text]
              - id: nero-v4-pro
                inputModalities: [text]
              - id: nero-v4-flash-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@nero/nero-attachment-local'
