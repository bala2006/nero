# The automation-only ACP application over nero-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@nero/nero-acp-app'

    # No provider ships with this build, so ACP leaves the provider and model
    # unset and follows the default model that agent-default-model adopts from
    # the user's first configured provider route.
    - id: acp
      name: '@nero/nero-acp'
      inject: [acpAppStartup]

- id: hmr
  disabled: true
