# SDK-profile patch for the child runtime in the cwd-inheritance proof.

- id: llm-nero
  name: '@nero/nero-llm-nero'
  disabled: true

- id: system-prompt
  name: '@nero/nero-system-prompt'
  config:
    personaPrefix: 'Echo where you run.'

- id: agent-instructions
  name: '@nero/nero-agent-instructions'
  disabled: true

- id: skill-filesystem
  name: '@nero/nero-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js neroHomePath('sessions')
    compression: none

- insert:
    - id: child-mock-llm
      name: './child-mock-llm.ts'
