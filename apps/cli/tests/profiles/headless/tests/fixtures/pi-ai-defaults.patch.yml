# pi-ai route and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-nero
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      nero:
        apiKeyEnv: NERO_API_KEY
        baseURL: !!js process.env.NERO_SNAPSHOT_BASE_URL
        reasoning: low
        modelOverrides:
          nero-v4-flash:
            maxTokens: 1024
        streamIdleTimeoutMs: 1000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: nero
        model: nero-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
