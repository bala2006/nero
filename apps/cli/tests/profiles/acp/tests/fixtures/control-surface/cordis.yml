# Keyless generic ACP v1 control-surface patch over `nero --profile acp`.

- id: llm-nero
  name: '@nero/nero-llm-nero'
  disabled: true

- id: acp
  name: '@nero/nero-acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@nero/nero-session-persistence-jsonl'
  config:
    root: !!js process.env.NERO_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
